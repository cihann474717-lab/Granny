<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>Granny Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
<style>
body { background: #000; margin: 0; overflow: hidden; touch-action: none; user-select: none; }
#unity-container { width: 100vw; height: 100vh; position: relative; }
#unity-canvas { width: 100%; height: 100%; }
#joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; z-index: 20; }
#touch-look-zone { position: absolute; top: 0; right: 0; width: 100vw; height: 100vh; z-index: 15; }
</style>
</head>
<body>
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="joystick-zone"></div>
    <div id="touch-look-zone"></div>
</div>

<script>
const canvas = document.querySelector("#unity-canvas");

// Basit Tıklama Simülasyonu (Etkileşim için)
function simulateClick() {
    const event = new MouseEvent('mousedown', { bubbles: true, cancelable: true });
    canvas.dispatchEvent(event);
    setTimeout(() => {
        canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    }, 100);
}

// Joystick ve Kamera Mantığı
function initMobileControls() {
    const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '75px', bottom: '75px' },
        color: 'white'
    });

    let activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
    
    manager.on('move', (evt, data) => {
        if (!data.vector) return;
        const x = data.vector.x;
        const y = data.vector.y;
        const newKeys = { KeyW: y > 0.3, KeyS: y < -0.3, KeyA: x < -0.3, KeyD: x > 0.3 };
        const keyMap = { KeyW: [87, 'w'], KeyS: [83, 's'], KeyA: [65, 'a'], KeyD: [68, 'd'] };

        for (let k in newKeys) {
            if (newKeys[k] && !activeKeys[k]) {
                canvas.dispatchEvent(new KeyboardEvent('keydown', { key: keyMap[k][1], keyCode: keyMap[k][0] }));
            } else if (!newKeys[k] && activeKeys[k]) {
                canvas.dispatchEvent(new KeyboardEvent('keyup', { key: keyMap[k][1], keyCode: keyMap[k][0] }));
            }
        }
        activeKeys = newKeys;
    });

    manager.on('end', () => {
        const keyMap = { KeyW: [87, 'w'], KeyS: [83, 's'], KeyA: [65, 'a'], KeyD: [68, 'd'] };
        for (let k in activeKeys) {
            if (activeKeys[k]) canvas.dispatchEvent(new KeyboardEvent('keyup', { key: keyMap[k][1], keyCode: keyMap[k][0] }));
        }
        activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
    });

    // Kamera Bakış ve Tıklama
    const lookZone = document.getElementById('touch-look-zone');
    let lastX = 0, lastY = 0, isMoving = false;

    lookZone.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            isMoving = false;
            // Hafif bir tıklama gecikmesi (etkileşim için)
            setTimeout(() => { if(!isMoving) simulateClick(); }, 150);
        }
    });

    lookZone.addEventListener('touchmove', (e) => {
        isMoving = true;
        const deltaX = (e.touches[0].clientX - lastX) * 2;
        const deltaY = (e.touches[0].clientY - lastY) * 2;
        canvas.dispatchEvent(new MouseEvent('mousemove', { movementX: deltaX, movementY: deltaY }));
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
    });
}

// Unity Yükleme
const buildUrl = "Build";
const config = { frameworkUrl: buildUrl + "/GrannyBog.framework.js", codeUrl: "", dataUrl: "" };
const script = document.createElement("script");
script.src = buildUrl + "/GrannyBog.loader.js";
script.onload = () => createUnityInstance(canvas, config).then(initMobileControls);
document.body.appendChild(script);
</script>
</body>
</html>
