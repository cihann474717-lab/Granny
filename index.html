<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Granny Mobile - Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
        width: 100%; height: 100%; overflow: hidden; 
        background: #000; touch-action: none; 
        user-select: none; -webkit-user-select: none;
        font-family: sans-serif;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
    
    #loading-ui { 
        position: absolute; top: 50%; left: 50%; 
        transform: translate(-50%, -50%);
        text-align: center; width: 80%; max-width: 300px; z-index: 10; 
    }
    #bar-container { width: 100%; height: 8px; background: #333; margin-top: 15px; border-radius: 4px; overflow: hidden; }
    #bar-fill { width: 0%; height: 100%; background: #4CAF50; }
    #status-text { font-size: 16px; font-weight: bold; color: #fff; }
    
    #unity-warning { 
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(255,0,0,0.9); padding: 10px; border-radius: 5px;
        display: none; color: white; z-index: 5000; max-width: 90%;
    }

    /* OYUNA BAŞLA */
    #start-btn {
        position: absolute; top: 50%; left: 50%; 
        transform: translate(-50%, -50%);
        z-index: 3000; padding: 20px 50px;
        background: #4CAF50; border: 3px solid #fff;
        border-radius: 50px; color: white; 
        font-size: 22px; font-weight: bold;
        display: none; text-transform: uppercase;
        box-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
        cursor: pointer;
    }
    #start-btn:active { background: #388E3C; }

    /* Test Butonları (Sol taraf) */
    #test-panel {
        position: absolute; top: 10px; left: 10px;
        z-index: 4000; display: none;
        background: rgba(0,0,0,0.9);
        border: 2px solid #4CAF50;
        border-radius: 10px; padding: 10px;
        max-width: 150px;
    }
    #test-panel button {
        display: block; width: 100%; padding: 8px;
        margin: 3px 0; background: #333; color: #fff;
        border: 1px solid #555; border-radius: 5px;
        font-size: 11px; cursor: pointer;
    }
    #test-panel button:active { background: #4CAF50; }
    #test-panel .title { color: #4CAF50; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
    #test-log {
        background: #111; border: 1px solid #333;
        padding: 5px; border-radius: 3px;
        max-height: 80px; overflow-y: auto;
        font-family: monospace; font-size: 9px;
        margin-top: 5px; color: #0f0;
    }

    /* Kontroller */
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; z-index: 100; display: none; }
    #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; z-index: 50; display: none; }
    
    #btn-interact {
        position: absolute; bottom: 40px; right: 40px;
        width: 90px; height: 90px; border-radius: 50%;
        background: rgba(255, 152, 0, 0.85); border: 3px solid #fff;
        color: white; font-size: 14px; font-weight: bold;
        display: none; z-index: 200; text-transform: uppercase;
    }
    #btn-esc {
        position: absolute; top: 20px; right: 20px;
        padding: 12px 20px; background: rgba(244, 67, 54, 0.85);
        border: 2px solid #fff; border-radius: 10px;
        color: white; font-size: 14px; font-weight: bold;
        display: none; z-index: 200; text-transform: uppercase;
    }
</style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    
    <div id="loading-ui">
        <div id="status-text">YÜKLENİYOR...</div>
        <div id="bar-container"><div id="bar-fill"></div></div>
    </div>
    
    <div id="unity-warning"></div>
    <div id="joystick-zone"></div>
    <div id="touch-look-zone"></div>
    
    <div id="btn-interact">AL / AÇ</div>
    <div id="btn-esc">ESC</div>
    <div id="start-btn">OYUNA BAŞLA</div>
    
    <!-- TEST PANELİ -->
    <div id="test-panel">
        <div class="title">🧪 TEST PANELİ</div>
        <button id="t1">1. window.dispatch</button>
        <button id="t2">2. canvas.dispatch</button>
        <button id="t3">3. execCommand</button>
        <button id="t4">4. Android Bridge</button>
        <button id="t5">5. Unity SendMessage</button>
        <button id="t6">6. Continue Tap</button>
        <div id="test-log">Hazır</div>
    </div>

<script>
    const canvas = document.querySelector("#unity-canvas");
    const statusText = document.querySelector("#status-text");
    const barFill = document.querySelector("#bar-fill");
    const loadingUI = document.querySelector("#loading-ui");
    const warning = document.querySelector("#unity-warning");
    const startBtn = document.querySelector("#start-btn");
    const btnInteract = document.querySelector("#btn-interact");
    const btnEsc = document.querySelector("#btn-esc");
    const joystickZone = document.querySelector("#joystick-zone");
    const lookZone = document.querySelector("#touch-look-zone");
    const testPanel = document.querySelector("#test-panel");
    const testLog = document.querySelector("#test-log");

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let unityInstance = null;

    function log(msg) {
        testLog.innerHTML = `> ${msg}<br>` + testLog.innerHTML;
    }

    // --- YÜKLEME ---
    async function getCombinedBlob(path, count, label) {
        const promises = [];
        for (let i = 1; i <= count; i++) {
            const num = i.toString().padStart(2, '0');
            const url = `${path}.part${num}`;
            promises.push(fetch(url).then(res => {
                if (!res.ok) throw new Error(`Eksik: ${url}`);
                return res.arrayBuffer();
            }));
        }
        statusText.textContent = `${label} İNDİRİLİYOR...`;
        const buffers = await Promise.all(promises);
        return URL.createObjectURL(new Blob(buffers));
    }

    // ============ 6 FARKLI EVENT GÖNDERME YÖNTEMİ ============

    // YÖNTEM 1: window.dispatchEvent
    function method1(key, keyCode) {
        canvas.focus();
        const down = new KeyboardEvent('keydown', {
            key: key, code: key, keyCode: keyCode, which: keyCode,
            bubbles: true, cancelable: true, composed: true
        });
        window.dispatchEvent(down);
        setTimeout(() => {
            window.dispatchEvent(new KeyboardEvent('keyup', {
                key: key, code: key, keyCode: keyCode, which: keyCode,
                bubbles: true, cancelable: true, composed: true
            }));
        }, 100);
        log(`M1: ${key}`);
    }

    // YÖNTEM 2: canvas.dispatchEvent (Pointer + Mouse + Keyboard)
    function method2(key, keyCode) {
        canvas.focus();
        const opts = {
            bubbles: true, cancelable: true, view: window,
            clientX: window.innerWidth / 2, clientY: window.innerHeight / 2,
            button: 0, buttons: 1
        };
        
        // Hem keyboard hem pointer gönder
        canvas.dispatchEvent(new KeyboardEvent('keydown', {
            key: key, code: key, keyCode: keyCode, which: keyCode,
            bubbles: true, cancelable: true
        }));
        
        canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
        canvas.dispatchEvent(new MouseEvent('mousedown', opts));
        
        setTimeout(() => {
            canvas.dispatchEvent(new KeyboardEvent('keyup', {
                key: key, code: key, keyCode: keyCode, which: keyCode,
                bubbles: true, cancelable: true
            }));
            canvas.dispatchEvent(new PointerEvent('pointerup', {...opts, buttons: 0}));
            canvas.dispatchEvent(new MouseEvent('mouseup', {...opts, buttons: 0}));
            canvas.dispatchEvent(new MouseEvent('click', {...opts, buttons: 0}));
        }, 100);
        log(`M2: ${key}`);
    }

    // YÖNTEM 3: execCommand (Eski usül)
    function method3(key, keyCode) {
        canvas.focus();
        try {
            const input = document.createElement('input');
            input.style.position = 'absolute';
            input.style.opacity = '0';
            input.style.pointerEvents = 'none';
            document.body.appendChild(input);
            input.focus();
            
            const ev = new KeyboardEvent('keydown', {
                key: key, keyCode: keyCode, which: keyCode,
                bubbles: true, cancelable: true
            });
            input.dispatchEvent(ev);
            
            setTimeout(() => {
                document.body.removeChild(input);
            }, 100);
        } catch(e) { log('M3 Hata: ' + e.message); }
        log(`M3: ${key}`);
    }

    // YÖNTEM 4: Unity SendMessage (Eğer oyun destekliyorsa)
    function method4() {
        if (unityInstance && unityInstance.SendMessage) {
            try {
                unityInstance.SendMessage('GameManager', 'OnContinue');
                log('M4: SendMessage OK');
            } catch(e) {
                log('M4 Hata: ' + e.message);
            }
        } else {
            log('M4: unityInstance yok');
        }
    }

    // YÖNTEM 5: Direct Mouse Click (Pointer)
    function method5(x, y) {
        canvas.focus();
        const rect = canvas.getBoundingClientRect();
        const cx = x || (rect.left + rect.width * 0.88);
        const cy = y || (rect.top + rect.height * 0.92);
        
        const opts = {
            bubbles: true, cancelable: true, composed: true, view: window,
            clientX: cx, clientY: cy, screenX: cx, screenY: cy,
            button: 0, buttons: 1, pointerId: 1, pointerType: 'mouse', isPrimary: true
        };
        
        canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
        canvas.dispatchEvent(new MouseEvent('mousedown', opts));
        
        setTimeout(() => {
            canvas.dispatchEvent(new PointerEvent('pointerup', {...opts, buttons: 0}));
            canvas.dispatchEvent(new MouseEvent('mouseup', {...opts, buttons: 0}));
            canvas.dispatchEvent(new MouseEvent('click', {...opts, buttons: 0}));
        }, 80);
        log(`M5 Tap: ${Math.round(cx)},${Math.round(cy)}`);
    }

    // YÖNTEM 6: Continue Tap (Sağ alt)
    function method6() {
        log('M6: Continue tıklanıyor...');
        method5(window.innerWidth * 0.88, window.innerHeight * 0.92);
    }

    // --- TEST PANELİ BUTONLARI ---
    document.querySelector('#t1').onclick = () => method1('Escape', 27);
    document.querySelector('#t2').onclick = () => method2('Escape', 27);
    document.querySelector('#t3').onclick = () => method3('Escape', 27);
    document.querySelector('#t4').onclick = () => method4();
    document.querySelector('#t5').onclick = () => method5();
    document.querySelector('#t6').onclick = () => method6();

    // --- BAŞLAT BUTONU ---
    startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        canvas.focus();
        
        // Continue'a tıkla
        setTimeout(() => method5(window.innerWidth * 0.88, window.innerHeight * 0.92), 200);
        
        startBtn.style.display = 'none';
        
        if (isMobile) {
            joystickZone.style.display = 'block';
            lookZone.style.display = 'block';
            btnInteract.style.display = 'flex';
            btnInteract.style.alignItems = 'center';
            btnInteract.style.justifyContent = 'center';
            btnEsc.style.display = 'block';
        }
        
        // Test panelini göster
        testPanel.style.display = 'block';
    });

    // --- AL / AÇ ---
    btnInteract.addEventListener('click', (e) => {
        e.preventDefault();
        method1('e', 69);
        setTimeout(() => method2('e', 69), 100);
        setTimeout(() => method5(), 200);
    });

    // --- ESC ---
    btnEsc.addEventListener('click', (e) => {
        e.preventDefault();
        method1('Escape', 27);
        setTimeout(() => method2('Escape', 27), 100);
    });

    // --- MOBİL KONTROLLER ---
    function initMobileControls() {
        const manager = nipplejs.create({
            zone: joystickZone, mode: 'static',
            position: { left: '75px', bottom: '75px' },
            color: 'white', size: 120
        });

        let activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        const keyMap = { KeyW: ['w', 87], KeyS: ['s', 83], KeyA: ['a', 65], KeyD: ['d', 68] };

        manager.on('move', (evt, data) => {
            if (!data.vector) return;
            const x = data.vector.x;
            const y = data.vector.y;
            const newKeys = { KeyW: y > 0.3, KeyS: y < -0.3, KeyA: x < -0.3, KeyD: x > 0.3 };

            for (let k in newKeys) {
                if (newKeys[k] && !activeKeys[k]) {
                    canvas.focus();
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keydown', { key, keyCode: code, which: code, bubbles: true }));
                } else if (!newKeys[k] && activeKeys[k]) {
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, keyCode: code, which: code, bubbles: true }));
                }
            }
            activeKeys = newKeys;
        });

        manager.on('end', () => {
            for (let k in activeKeys) {
                if (activeKeys[k]) {
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, keyCode: code, which: code, bubbles: true }));
                }
            }
            activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        });

        // Kamera
        let lastX = 0, lastY = 0, touching = false;

        lookZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touching = true;
            }
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touching || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const dx = (touch.clientX - lastX) * 2.0;
            const dy = (touch.clientY - lastY) * 2.0;
            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                const rect = canvas.getBoundingClientRect();
                canvas.dispatchEvent(new MouseEvent('mousemove', {
                    bubbles: true, cancelable: true, composed: true, view: window,
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2,
                    movementX: dx, movementY: dy
                }));
            }
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, { passive: false });

        lookZone.addEventListener('touchend', () => { touching = false; }, { passive: false });
    }

    // --- UNITY BAŞLAT ---
    const buildUrl = "Build";
    const config = {
        dataUrl: "",
        frameworkUrl: buildUrl + "/GrannyBog.framework.js",
        codeUrl: "",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Truffled",
        productName: "Granny",
        productVersion: "1.0",
    };

    async function start() {
        try {
            const [dataBlob, wasmBlob] = await Promise.all([
                getCombinedBlob(buildUrl + "/GrannyBog.data", 23, "DATA"),
                getCombinedBlob(buildUrl + "/GrannyBog.wasm", 2, "WASM")
            ]);
            
            config.dataUrl = dataBlob;
            config.codeUrl = wasmBlob;
            statusText.textContent = "Oyun Hazırlanıyor...";
            
            const script = document.createElement("script");
            script.src = buildUrl + "/GrannyBog.loader.js";
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    barFill.style.width = (100 * progress) + "%";
                }).then((instance) => {
                    unityInstance = instance;
                    loadingUI.style.display = "none";
                    startBtn.style.display = "block";
                    canvas.setAttribute('tabindex', '0');
                    setTimeout(() => canvas.focus(), 500);
                    initMobileControls();
                }).catch(err => {
                    warning.textContent = "Hata: " + err;
                    warning.style.display = "block";
                });
            };
            document.body.appendChild(script);
        } catch (e) {
            warning.textContent = "Yükleme Hatası: " + e.message;
            warning.style.display = "block";
        }
    }
    
    window.addEventListener('load', start);
</script>
</body>
</html>
