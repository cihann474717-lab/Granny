<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Granny Mobile</title>
<!-- Mobil için tam ekran ve ölçeklendirme ayarları -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
<style>
    body { 
        background: #000; 
        color: #fff; 
        font-family: sans-serif; 
        margin: 0; 
        padding: 0;
        overflow: hidden; 
        touch-action: none; 
        user-select: none; 
        -webkit-user-select: none;
        width: 100vw;
        height: 100vh;
    }
    
    #unity-container { 
        width: 100%; 
        height: 100%; 
        position: fixed; 
        top: 0;
        left: 0;
        display: flex; 
        align-items: center; 
        justify-content: center; 
        z-index: 1;
    }
    
    #unity-canvas { 
        width: 100%; 
        height: 100%; 
        background: #000; 
        display: block;
    }

    /* Yükleme Ekranı */
    #loading-ui { 
        position: absolute; 
        text-align: center; 
        width: 80%; 
        max-width: 300px;
        z-index: 10; 
    }
    #bar-container { 
        width: 100%; 
        height: 8px; 
        background: #333; 
        margin-top: 15px; 
        border-radius: 4px; 
        overflow: hidden;
    }
    #bar-fill { 
        width: 0%; 
        height: 100%; 
        background: #4CAF50; /* Yeşil bar */
        border-radius: 4px; 
        transition: width 0.1s linear; 
    }
    #status-text { 
        font-size: 16px; 
        font-weight: bold;
        text-transform: uppercase; 
        letter-spacing: 1px; 
        text-shadow: 0 0 5px #000;
    }

    /* Uyarı Kutusu */
    #unity-warning { 
        position: absolute; 
        top: 20px; 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 0, 0, 0.9); 
        padding: 10px; 
        border-radius: 5px;
        display: none; 
        color: white; 
        text-align: center;
        z-index: 1000; 
        max-width: 90%;
    }

    /* Joystick Alanı */
    #joystick-zone { 
        position: absolute; 
        bottom: 30px; 
        left: 30px; 
        width: 140px; 
        height: 140px; 
        z-index: 20; 
    }

    /* Kamera Hareket Alanı (Sağ Taraf) */
    #touch-look-zone { 
        position: absolute; 
        top: 0; 
        right: 0; 
        width: 50%; /* Sadece sağ yarı */
        height: 100%; 
        z-index: 15; 
    }

    /* Menü Geçiş Katmanı */
    #menu-click-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999;
        background: rgba(0, 0, 0, 0.01); /* Görünmez ama tıklanabilir */
        display: none;
    }
</style>
</head>
<body>

<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <div id="loading-ui">
        <div id="status-text">YÜKLENİYOR...</div>
        <div id="bar-container"><div id="bar-fill"></div></div>
    </div>
    
    <div id="unity-warning"></div>

    <!-- Tüm Ekran Dokunma Katmanı (Başlat/Devam Et butonları için) -->
    <div id="menu-click-overlay"></div>

    <!-- Kontroller -->
    <div id="joystick-zone"></div>
    <div id="touch-look-zone"></div>
</div>

<script>
    const canvas = document.querySelector("#unity-canvas");
    const statusText = document.querySelector("#status-text");
    const barFill = document.querySelector("#bar-fill");
    const loadingUI = document.querySelector("#loading-ui");
    const warning = document.querySelector("#unity-warning");
    const menuOverlay = document.querySelector("#menu-click-overlay");

    // --- HIZLI YÜKLEME FONKSİYONU (PARALEL İNDİRME) ---
    async function getCombinedBlob(path, count, label) {
        const promises = [];
        // Tüm parçaları aynı anda indirmek için promise dizisi oluştur
        for (let i = 1; i <= count; i++) {
            const num = i.toString().padStart(2, '0');
            const url = `${path}.part${num}`;
            promises.push(fetch(url).then(res => {
                if (!res.ok) throw new Error(`Eksik dosya: ${url}`);
                return res.arrayBuffer();
            }));
        }

        // Hepsini bekle
        statusText.textContent = `${label} İNDİRİLİYOR...`;
        const buffers = await Promise.all(promises);
        
        // Birleştir
        return URL.createObjectURL(new Blob(buffers));
    }

    // --- SENTETİK TIKLAMA (BUTONLAR İÇİN) ---
    function forceContinueClick(x, y) {
        const rect = canvas.getBoundingClientRect();
        // Eğer koordinat gelmezse ekranın sağ altını (Continue butonu genelde oradadır) hedef al
        const clickX = x || (rect.left + (rect.width * 0.85));
        const clickY = y || (rect.top + (rect.height * 0.90));

        const eventOptions = {
            bubbles: true,
            cancelable: true,
            view: window,
            clientX: clickX,
            clientY: clickY,
            screenX: clickX,
            screenY: clickY,
            button: 0,
            buttons: 1
        };

        // Hem Pointer hem Mouse eventlerini gönder (Unity hangisini dinliyorsa)
        canvas.dispatchEvent(new PointerEvent('pointerdown', eventOptions));
        canvas.dispatchEvent(new MouseEvent('mousedown', eventOptions));
        
        setTimeout(() => {
            canvas.dispatchEvent(new PointerEvent('pointerup', eventOptions));
            canvas.dispatchEvent(new MouseEvent('mouseup', eventOptions));
            canvas.dispatchEvent(new MouseEvent('click', eventOptions));
        }, 50);
    }

    // Menü katmanına tıklandığında oyunu başlat
    menuOverlay.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        forceContinueClick(e.clientX, e.clientY);
        // Katmanı kaldırma, oyun içi menülerde de gerekebilir, sadece görünmez yap
        menuOverlay.style.display = 'none'; 
    });

    // --- MOBİL KONTROLLER ---
    function initMobileControls() {
        menuOverlay.style.display = 'block'; // Başlangıçta menü geçişini aç

        // Joystick
        const manager = nipplejs.create({
            zone: document.getElementById('joystick-zone'),
            mode: 'static',
            position: { left: '70px', bottom: '70px' },
            color: 'white',
            size: 120
        });

        let activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        const keyMap = { KeyW: [87, 'w'], KeyS: [83, 's'], KeyA: [65, 'a'], KeyD: [68, 'd'] };

        manager.on('move', (evt, data) => {
            if (!data.vector) return;
            const x = data.vector.x;
            const y = data.vector.y;
            const newKeys = { KeyW: y > 0.3, KeyS: y < -0.3, KeyA: x < -0.3, KeyD: x > 0.3 };

            for (let k in newKeys) {
                if (newKeys[k] && !activeKeys[k]) {
                    canvas.dispatchEvent(new KeyboardEvent('keydown', { key: keyMap[k][1], keyCode: keyMap[k][0], bubbles: true }));
                } else if (!newKeys[k] && activeKeys[k]) {
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: keyMap[k][1], keyCode: keyMap[k][0], bubbles: true }));
                }
            }
            activeKeys = newKeys;
        });

        manager.on('end', () => {
            for (let k in activeKeys) {
                if (activeKeys[k]) {
                    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: keyMap[k][1], keyCode: keyMap[k][0], bubbles: true }));
                }
            }
            activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        });

        // Kamera ve Etkileşim
        const lookZone = document.getElementById('touch-look-zone');
        let lastX = 0, lastY = 0, isMoving = false;

        lookZone.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                isMoving = false;
            }
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Sayfanın kaymasını engelle
            isMoving = true;
            const touch = e.touches[0];
            // Hassasiyeti artırdım (2 yerine 2.5)
            const deltaX = (touch.clientX - lastX) * 2.5;
            const deltaY = (touch.clientY - lastY) * 2.5;
            
            canvas.dispatchEvent(new MouseEvent('mousemove', { 
                movementX: deltaX, 
                movementY: deltaY, 
                bubbles: true 
            }));
            
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, { passive: false });

        lookZone.addEventListener('touchend', () => {
            if (!isMoving) {
                // Eğer sadece dokunup bıraktıysa (tıklama), ateş etme/etkileşim
                canvas.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
                setTimeout(() => {
                    canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, cancelable: true }));
                }, 100);
            }
        });
    }

    // --- UNITY BAŞLATMA ---
    const buildUrl = "Build";
    const config = {
        dataUrl: "",
        frameworkUrl: buildUrl + "/GrannyBog.framework.js",
        codeUrl: "",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Truffled",
        productName: "Granny",
        productVersion: "1.0",
    };

    async function start() {
        try {
            // Data ve Wasm dosyalarını paralel indir
            // Not: Parça sayılarını (23 ve 2) kendi dosyalarına göre kontrol et
            const dataPromise = getCombinedBlob(buildUrl + "/GrannyBog.data", 23, "DATA");
            const wasmPromise = getCombinedBlob(buildUrl + "/GrannyBog.wasm", 2, "WASM");
            
            // İkisini aynı anda bekle
            const [dataBlob, wasmBlob] = await Promise.all([dataPromise, wasmPromise]);
            
            config.dataUrl = dataBlob;
            config.codeUrl = wasmBlob;
            
            statusText.textContent = "Oyun Hazırlanıyor...";
            
            const script = document.createElement("script");
            script.src = buildUrl + "/GrannyBog.loader.js";
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    barFill.style.width = (100 * progress) + "%";
                }).then((unityInstance) => {
                    loadingUI.style.display = "none";
                    initMobileControls();
                    
                    // Tam ekran zorla (isteğe bağlı)
                    if (unityInstance.Module && unityInstance.Module.canvas) {
                         // unityInstance.Module.canvas.requestFullscreen(); 
                    }
                }).catch(err => {
                    warning.textContent = "Hata: " + err;
                    warning.style.display = "block";
                });
            };
            document.body.appendChild(script);
        } catch (e) {
            warning.textContent = "Yükleme Hatası: " + e.message;
            warning.style.display = "block";
        }
    }
    
    // Sayfa yüklendiğinde başlat
    window.addEventListener('load', start);
</script>
</body>
</html>
