<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Granny Mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
        width: 100%; height: 100%; overflow: hidden; 
        background: #000; touch-action: none; 
        user-select: none; -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #000; outline: none; }
    
    /* YÜKLEME */
    #loading-ui { 
        position: absolute; top: 50%; left: 50%; 
        transform: translate(-50%, -50%);
        text-align: center; width: 80%; max-width: 300px; z-index: 10; 
    }
    #bar-container { width: 100%; height: 6px; background: #222; margin-top: 15px; border-radius: 3px; overflow: hidden; }
    #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); transition: width 0.15s linear; }
    #status-text { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 2px; }

    #unity-warning { 
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(220, 53, 69, 0.95); padding: 10px 15px; border-radius: 8px;
        display: none; color: white; z-index: 5000; max-width: 90%; font-size: 13px;
    }

    /* OYUNA BAŞLA */
    #start-btn {
        position: absolute; top: 50%; left: 50%; 
        transform: translate(-50%, -50%);
        z-index: 3000; padding: 18px 45px;
        background: linear-gradient(135deg, #4CAF50, #388E3C);
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50px; color: white; 
        font-size: 18px; font-weight: 700;
        display: none; text-transform: uppercase; letter-spacing: 2px;
        box-shadow: 0 10px 30px rgba(76, 175, 80, 0.5);
        cursor: pointer;
    }
    #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }

    /* JOYSTICK */
    #joystick-zone { 
        position: absolute; bottom: 25px; left: 25px; 
        width: 130px; height: 130px; z-index: 100; 
        display: none;
    }

    /* KAMERA ALANI - SAĞDA SADECE %40, ALTTAKİ BUTONA ÇARPMIYOR */
    #touch-look-zone { 
        position: absolute; top: 0; right: 0; 
        width: 40%; height: 75%; z-index: 50; 
        display: none;
        pointer-events: auto;
    }

    /* AL / AÇ BUTONU - KÜÇÜK, ŞEFFAF, PROFESYONEL */
    #btn-interact {
        position: absolute; bottom: 30px; right: 25px;
        width: 65px; height: 65px; border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: white;
        display: none; z-index: 200;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.05);
        transition: all 0.15s ease;
    }
    #btn-interact svg {
        width: 28px; height: 28px;
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        fill: white;
    }
    #btn-interact:active {
        background: rgba(76, 175, 80, 0.6);
        border-color: #4CAF50;
        transform: scale(0.9);
        box-shadow: 0 0 25px rgba(76, 175, 80, 0.7);
    }

    /* DEBUG BUTONU */
    #debug-toggle {
        position: absolute; top: 15px; right: 15px;
        width: 35px; height: 35px; border-radius: 50%;
        background: rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.2);
        color: white; font-size: 14px;
        z-index: 3000; display: none; cursor: pointer;
    }

    /* DEBUG PANEL */
    #debug-panel {
        position: absolute; top: 60px; right: 15px;
        width: 200px;
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px; padding: 10px;
        z-index: 4000; display: none;
    }
    #debug-panel button {
        display: block; width: 100%; padding: 8px;
        margin: 3px 0; background: rgba(255,255,255,0.08);
        color: #fff; border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px; font-size: 11px; cursor: pointer;
    }
    #debug-panel button:active { background: rgba(76,175,80,0.4); }
    #debug-panel .title { color: #4CAF50; font-size: 10px; font-weight: 700; margin-bottom: 5px; letter-spacing: 1px; }
    #debug-log {
        background: #000; border: 1px solid #222;
        padding: 5px; border-radius: 4px;
        max-height: 70px; overflow-y: auto;
        font-family: monospace; font-size: 9px;
        margin-top: 5px; color: #4CAF50;
    }
</style>
</head>
<body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    
    <div id="loading-ui">
        <div id="status-text">YÜKLENİYOR...</div>
        <div id="bar-container"><div id="bar-fill"></div></div>
    </div>
    
    <div id="unity-warning"></div>
    <div id="joystick-zone"></div>
    <div id="touch-look-zone"></div>
    
    <!-- AL / AÇ BUTONU (Profesyonel İkonlu) -->
    <div id="btn-interact">
        <svg viewBox="0 0 24 24">
            <path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/>
        </svg>
    </div>
    
    <div id="start-btn">OYUNA BAŞLA</div>
    
    <!-- DEBUG -->
    <div id="debug-toggle">⚙</div>
    <div id="debug-panel">
        <div class="title">🧪 DEBUG</div>
        <button id="t1">ESC Gönder</button>
        <button id="t2">E Tuşu</button>
        <button id="t3">Continue Tap</button>
        <button id="t4">Merkeze Tıkla</button>
        <div id="debug-log">Hazır</div>
    </div>

<script>
    const canvas = document.querySelector("#unity-canvas");
    const statusText = document.querySelector("#status-text");
    const barFill = document.querySelector("#bar-fill");
    const loadingUI = document.querySelector("#loading-ui");
    const warning = document.querySelector("#unity-warning");
    const startBtn = document.querySelector("#start-btn");
    const btnInteract = document.querySelector("#btn-interact");
    const joystickZone = document.querySelector("#joystick-zone");
    const lookZone = document.querySelector("#touch-look-zone");
    const debugToggle = document.querySelector("#debug-toggle");
    const debugPanel = document.querySelector("#debug-panel");
    const debugLog = document.querySelector("#debug-log");

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    let unityInstance = null;
    let lastTapTime = 0;

    function log(msg) {
        debugLog.innerHTML = `> ${msg}<br>` + debugLog.innerHTML;
        if (debugLog.children.length > 10) debugLog.removeChild(debugLog.lastChild);
    }

    // --- HIZLI YÜKLEME ---
    async function getCombinedBlob(path, count, label) {
        const promises = [];
        for (let i = 1; i <= count; i++) {
            const num = i.toString().padStart(2, '0');
            promises.push(fetch(`${path}.part${num}`).then(res => {
                if (!res.ok) throw new Error(`Eksik: ${path}.part${num}`);
                return res.arrayBuffer();
            }));
        }
        statusText.textContent = `${label} İNDİRİLİYOR...`;
        return URL.createObjectURL(new Blob(await Promise.all(promises)));
    }

    // --- EVENT GÖNDERME ---
    function sendKey(key, keyCode) {
        canvas.focus();
        const down = new KeyboardEvent('keydown', {
            key, code: key === 'Escape' ? 'Escape' : 'Key' + key.toUpperCase(),
            keyCode, which: keyCode,
            bubbles: true, cancelable: true, composed: true
        });
        window.dispatchEvent(down);
        document.dispatchEvent(down);
        canvas.dispatchEvent(down);
        setTimeout(() => {
            const up = new KeyboardEvent('keyup', {
                key, code: key === 'Escape' ? 'Escape' : 'Key' + key.toUpperCase(),
                keyCode, which: keyCode,
                bubbles: true, cancelable: true, composed: true
            });
            window.dispatchEvent(up);
            document.dispatchEvent(up);
            canvas.dispatchEvent(up);
        }, 80);
        log(`Key: ${key}`);
    }

    function sendTap(x, y) {
        canvas.focus();
        const rect = canvas.getBoundingClientRect();
        const cx = x !== undefined ? x : rect.left + rect.width / 2;
        const cy = y !== undefined ? y : rect.top + rect.height / 2;
        
        const opts = {
            bubbles: true, cancelable: true, composed: true, view: window,
            clientX: cx, clientY: cy, screenX: cx, screenY: cy,
            button: 0, buttons: 1, pointerId: 1, pointerType: 'mouse', isPrimary: true
        };
        
        canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
        canvas.dispatchEvent(new MouseEvent('mousedown', opts));
        setTimeout(() => {
            const up = {...opts, buttons: 0};
            canvas.dispatchEvent(new PointerEvent('pointerup', up));
            canvas.dispatchEvent(new MouseEvent('mouseup', up));
            canvas.dispatchEvent(new MouseEvent('click', up));
        }, 60);
        log(`Tap: ${Math.round(cx)},${Math.round(cy)}`);
    }

    // --- BAŞLAT ---
    startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        canvas.focus();
        setTimeout(() => sendTap(window.innerWidth * 0.85, window.innerHeight * 0.90), 250);
        startBtn.style.display = 'none';
        
        if (isMobile) {
            joystickZone.style.display = 'block';
            lookZone.style.display = 'block';
            btnInteract.style.display = 'block';
            debugToggle.style.display = 'block';
        }
    });

    // --- AL / AÇ (Küçük Profesyonel Buton) ---
    btnInteract.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        // Hem E tuşu hem tıklama gönder (garanti çalışsın)
        sendKey('e', 69);
        setTimeout(() => sendTap(), 80);
    });

    // --- DOUBLE TAP İLE ESC (Animasyon Atla) ---
    lookZone.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTapTime < 300) {
            // Çift dokunma = ESC
            sendKey('Escape', 27);
            lastTapTime = 0;
        } else {
            lastTapTime = now;
        }
    });

    // --- DEBUG ---
    debugToggle.addEventListener('click', () => {
        debugPanel.style.display = debugPanel.style.display === 'block' ? 'none' : 'block';
    });
    document.querySelector('#t1').onclick = () => sendKey('Escape', 27);
    document.querySelector('#t2').onclick = () => sendKey('e', 69);
    document.querySelector('#t3').onclick = () => sendTap(window.innerWidth * 0.85, window.innerHeight * 0.90);
    document.querySelector('#t4').onclick = () => sendTap();

    // --- MOBİL KONTROLLER ---
    function initMobileControls() {
        // JOYSTICK
        const manager = nipplejs.create({
            zone: joystickZone, mode: 'static',
            position: { left: '65px', bottom: '65px' },
            color: 'white', size: 100
        });

        let activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        const keyMap = { KeyW: ['w', 87], KeyS: ['s', 83], KeyA: ['a', 65], KeyD: ['d', 68] };

        manager.on('move', (evt, data) => {
            if (!data.vector) return;
            const x = data.vector.x, y = data.vector.y;
            const newKeys = { KeyW: y > 0.3, KeyS: y < -0.3, KeyA: x < -0.3, KeyD: x > 0.3 };

            for (let k in newKeys) {
                if (newKeys[k] && !activeKeys[k]) {
                    canvas.focus();
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keydown', { key, keyCode: code, which: code, bubbles: true }));
                } else if (!newKeys[k] && activeKeys[k]) {
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, keyCode: code, which: code, bubbles: true }));
                }
            }
            activeKeys = newKeys;
        });

        manager.on('end', () => {
            for (let k in activeKeys) {
                if (activeKeys[k]) {
                    const [key, code] = keyMap[k];
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, keyCode: code, which: code, bubbles: true }));
                }
            }
            activeKeys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false };
        });

        // KAMERA (Sadece sağ üst %40 alanda)
        let lastX = 0, lastY = 0, touching = false;

        lookZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                touching = true;
            }
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!touching || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const dx = (touch.clientX - lastX) * 2.2;
            const dy = (touch.clientY - lastY) * 2.2;
            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                const rect = canvas.getBoundingClientRect();
                canvas.dispatchEvent(new MouseEvent('mousemove', {
                    bubbles: true, cancelable: true, composed: true, view: window,
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2,
                    movementX: dx, movementY: dy
                }));
            }
            lastX = touch.clientX;
            lastY = touch.clientY;
        }, { passive: false });

        lookZone.addEventListener('touchend', () => { touching = false; }, { passive: false });
    }

    // --- UNITY BAŞLAT ---
    const buildUrl = "Build";
    const config = {
        dataUrl: "",
        frameworkUrl: buildUrl + "/GrannyBog.framework.js",
        codeUrl: "",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Truffled",
        productName: "Granny",
        productVersion: "1.0",
    };

    async function start() {
        try {
            const [dataBlob, wasmBlob] = await Promise.all([
                getCombinedBlob(buildUrl + "/GrannyBog.data", 23, "DATA"),
                getCombinedBlob(buildUrl + "/GrannyBog.wasm", 2, "WASM")
            ]);
            config.dataUrl = dataBlob;
            config.codeUrl = wasmBlob;
            statusText.textContent = "Oyun Hazırlanıyor...";
            
            const script = document.createElement("script");
            script.src = buildUrl + "/GrannyBog.loader.js";
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    barFill.style.width = (100 * progress) + "%";
                }).then((instance) => {
                    unityInstance = instance;
                    loadingUI.style.display = "none";
                    startBtn.style.display = "block";
                    canvas.setAttribute('tabindex', '0');
                    setTimeout(() => canvas.focus(), 500);
                    initMobileControls();
                }).catch(err => {
                    warning.textContent = "Hata: " + err;
                    warning.style.display = "block";
                });
            };
            document.body.appendChild(script);
        } catch (e) {
            warning.textContent = "Yükleme Hatası: " + e.message;
            warning.style.display = "block";
        }
    }
    
    window.addEventListener('load', start);
</script>
</body>
</html>
